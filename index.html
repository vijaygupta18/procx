<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProcX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #1a1a1a;
  color: #e8e8e8;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 1440px; margin: 0 auto; padding: 16px 20px 80px; }

/* ===== HEADER ===== */
.header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #333;
}

.brand {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 18px; font-weight: 700; color: #e8e8e8;
}

.header-meta { display: flex; align-items: center; gap: 16px; }

.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #999;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
}

.live-dot { width: 6px; height: 6px; background: #4ec9b0; border-radius: 50%; }

.clock {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 12px; color: #777;
}

/* ===== RECOMMENDATIONS ===== */
.recs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

.rec-banner {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border: 1px solid #333;
  border-radius: 3px;
  font-size: 13px;
  background: #222;
}

.rec-banner.memory { border-left: 3px solid #e5a822; }
.rec-banner.cpu { border-left: 3px solid #e05555; }
.rec-banner.stale { border-left: 3px solid #888; }

.rec-banner .rec-label { font-weight: 600; white-space: nowrap; }
.rec-banner.memory .rec-label { color: #e5a822; }
.rec-banner.cpu .rec-label { color: #e05555; }
.rec-banner.stale .rec-label { color: #999; }

.rec-banner .rec-msg { flex: 1; color: #bbb; }

.rec-banner .rec-btn {
  padding: 3px 10px; border: none; background: none;
  font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit;
}

.rec-banner.memory .rec-btn { color: #e5a822; }
.rec-banner.memory .rec-btn:hover { text-decoration: underline; }
.rec-banner.cpu .rec-btn { color: #e05555; }
.rec-banner.cpu .rec-btn:hover { text-decoration: underline; }
.rec-banner.stale .rec-btn { color: #999; }
.rec-banner.stale .rec-btn:hover { text-decoration: underline; }

/* ===== STATS ===== */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  margin-bottom: 16px;
}

.stat {
  padding: 12px 14px;
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
}

.stat-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: #777; margin-bottom: 4px;
}

.stat-value {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 24px; font-weight: 700; color: #4ec9b0;
  font-feature-settings: 'tnum' 1;
}

.stat-sub {
  font-size: 11px; color: #666; margin-top: 2px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
}

/* ===== MEMORY MAP ===== */
.memmap-section { margin-bottom: 16px; }

.section-title {
  font-size: 11px; font-weight: 600; color: #777;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.memmap {
  display: flex; gap: 2px; height: 32px;
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
  padding: 3px;
  overflow: hidden;
}

.memmap-block {
  border-radius: 2px;
  min-width: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.memmap-block:hover { filter: brightness(1.3); }

.memmap-block .mm-label {
  font-size: 9px; font-weight: 600;
  color: rgba(255,255,255,0.85);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 3px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
}

.memmap-tooltip {
  position: fixed;
  padding: 6px 10px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 3px;
  font-size: 12px; color: #ccc;
  pointer-events: none;
  z-index: 500;
  display: none;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
}

.memmap-tooltip .tt-name { font-weight: 700; color: #e8e8e8; margin-bottom: 2px; }
.memmap-tooltip .tt-detail { color: #999; }

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px; flex-wrap: wrap;
}

.tab-bar { display: flex; gap: 0; }

.tab {
  padding: 6px 14px; border: none; background: transparent;
  color: #777; font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; gap: 5px;
}

.tab:hover { color: #bbb; }
.tab.active { color: #4ec9b0; border-bottom-color: #4ec9b0; }

.tab-count {
  font-size: 10px; font-weight: 700;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  color: #666;
}

.tab.active .tab-count { color: #4ec9b0; }

.search-wrap { position: relative; flex: 1; max-width: 280px; }

.search-wrap input {
  width: 100%; padding: 6px 10px;
  background: #222; border: 1px solid #333;
  color: #e8e8e8; border-radius: 3px;
  font-size: 13px; font-family: inherit; outline: none;
}

.search-wrap input:focus { border-color: #4ec9b0; }
.search-wrap input::placeholder { color: #555; }

.toolbar-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }

.icon-btn {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  background: #222; border: 1px solid #333;
  border-radius: 3px; cursor: pointer; color: #999;
}

.icon-btn:hover { border-color: #555; color: #e8e8e8; }
.icon-btn svg { width: 14px; height: 14px; }

.toggle-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #777; cursor: pointer;
}

.switch {
  position: relative; width: 30px; height: 16px;
  -webkit-appearance: none; appearance: none;
  background: #444; border: none;
  border-radius: 8px; cursor: pointer; outline: none;
}

.switch::before {
  content: ''; position: absolute; width: 12px; height: 12px;
  border-radius: 50%; background: #888; top: 2px; left: 2px;
  transition: all 0.15s ease;
}

.switch:checked { background: #4ec9b0; }
.switch:checked::before { transform: translateX(14px); background: #1a1a1a; }

/* ===== TABLE ===== */
.table-wrap {
  background: #222;
  border: 1px solid #333;
  border-radius: 3px;
  overflow: hidden;
}

table { width: 100%; border-collapse: collapse; }

thead th {
  text-align: left; padding: 8px 12px;
  background: #282828; color: #777;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; border-bottom: 1px solid #333;
  cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 5;
  white-space: nowrap;
}

thead th:hover { color: #bbb; }
thead th.sorted { color: #4ec9b0; }

.sort-arr { margin-left: 3px; font-size: 9px; display: inline-block; }
.sort-arr.up { transform: rotate(180deg); }

tbody tr { border-bottom: 1px solid #2a2a2a; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #282828; }

tbody tr.row-idle { background: #2a2510; }
tbody tr.row-idle:hover { background: #332d14; }

tbody tr.row-hog { background: #2a1515; }
tbody tr.row-hog:hover { background: #331a1a; }

tbody tr.row-selected { background: #1a2a2a; border-left: 2px solid #4ec9b0; }

tbody tr.row-group { background: #262626; cursor: pointer; }
tbody tr.row-group:hover { background: #2e2e2e; }

tbody tr.row-child { background: #1e1e1e; }
tbody tr.row-child td:nth-child(3) { padding-left: 40px; }

td { padding: 6px 12px; vertical-align: middle; font-size: 13px; }

.cell-check { width: 32px; text-align: center; }

.custom-check {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px;
  border: 1px solid #555; border-radius: 2px;
  cursor: pointer; background: transparent;
  position: relative;
}

.custom-check:hover { border-color: #4ec9b0; }
.custom-check:checked { background: #4ec9b0; border-color: #4ec9b0; }
.custom-check:checked::after {
  content: ''; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 7px; border: solid #1a1a1a; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.cell-pid {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 11px; color: #777;
}

.proc-row { display: flex; align-items: center; gap: 8px; }

.proc-avatar {
  width: 24px; height: 24px; border-radius: 3px;
  display: grid; place-items: center;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 10px; font-weight: 700; color: #e8e8e8;
  flex-shrink: 0;
}

.proc-meta { min-width: 0; }

.proc-name {
  font-weight: 600; font-size: 13px; color: #e8e8e8;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;
  display: flex; align-items: center; gap: 5px;
}

.proc-name .group-count {
  font-size: 10px; font-weight: 600;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  color: #777;
}

.proc-name .expand-icon {
  font-size: 9px; color: #777;
  display: inline-block; margin-right: 2px;
  transition: transform 0.1s;
}

.proc-name .expand-icon.open { transform: rotate(90deg); }

.proc-cmd {
  font-size: 11px; color: #555;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 300px; margin-top: 1px; cursor: help;
}

/* CPU inline bar */
.cpu-cell { white-space: nowrap; }

.cpu-inline {
  display: flex; align-items: center; gap: 6px;
}

.cpu-bar-track {
  width: 50px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
}

.cpu-bar-fill { height: 100%; border-radius: 2px; }

.cpu-text {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 12px; font-weight: 600;
  font-feature-settings: 'tnum' 1;
  min-width: 48px; text-align: right;
}

.cpu-text.c-crit { color: #e05555; }
.cpu-text.c-high { color: #e5a822; }
.cpu-text.c-med { color: #4ec9b0; }
.cpu-text.c-low { color: #666; }

/* Memory */
.mem-vis { display: flex; align-items: center; gap: 6px; }

.mem-text {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 12px; font-weight: 600;
  font-feature-settings: 'tnum' 1;
  min-width: 60px; text-align: right;
}

.mem-bar-track {
  width: 40px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
}

.mem-bar-fill { height: 100%; border-radius: 2px; }

.cell-uptime {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 11px; color: #888; white-space: nowrap;
}

/* Port tags */
.port-tag {
  display: inline-block;
  padding: 1px 6px; margin: 1px 2px;
  background: #1a2a2a; border: 1px solid #2a3a3a;
  border-radius: 2px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 10px; font-weight: 600; color: #4ec9b0;
}

/* Status */
.badge {
  display: inline-block;
  padding: 2px 6px; border-radius: 2px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-idle { background: #2a2510; color: #e5a822; }
.badge-active { background: #152a1a; color: #4ec9b0; }
.badge-hog { background: #2a1515; color: #e05555; }

/* Kill button */
.kill-btn {
  padding: 2px 0; border: none; background: none;
  color: #e05555; cursor: pointer;
  font-size: 12px; font-weight: 600; font-family: inherit;
}

.kill-btn:hover { text-decoration: underline; }

/* ===== ACTION BAR ===== */
.action-bar {
  position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
  background: #2a2a2a; border: 1px solid #444;
  border-radius: 3px; padding: 8px 16px;
  display: flex; align-items: center; gap: 16px;
  z-index: 100;
  transition: bottom 0.2s ease;
}

.action-bar.show { bottom: 20px; }
.action-bar .ab-info { font-size: 13px; color: #999; }
.action-bar .ab-info strong { color: #4ec9b0; }

.ab-btn {
  padding: 6px 14px; border: none; border-radius: 3px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer;
}

.ab-clear { background: #333; color: #999; }
.ab-clear:hover { color: #e8e8e8; }

.ab-kill { background: #e05555; color: #fff; }
.ab-kill:hover { background: #c04444; }

/* ===== MODAL ===== */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 200; display: grid; place-items: center;
  opacity: 0; visibility: hidden; transition: opacity 0.15s;
}

.modal-bg.open { opacity: 1; visibility: visible; }

.modal-box {
  background: #2a2a2a; border: 1px solid #444;
  border-radius: 4px; padding: 20px; width: 420px; max-width: 92vw;
}

.modal-box h2 { font-size: 16px; font-weight: 700; color: #e8e8e8; margin-bottom: 6px; }
.modal-box p { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 16px; }

.modal-preview {
  background: #222; border: 1px solid #333;
  border-radius: 3px; padding: 10px 12px;
  margin-bottom: 16px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 12px; color: #999;
  max-height: 140px; overflow-y: auto;
}

.modal-preview .mp-name { color: #e8e8e8; font-weight: 700; font-size: 14px; margin-bottom: 4px; font-family: inherit; }

.modal-footer { display: flex; gap: 8px; justify-content: flex-end; }

.modal-footer button {
  padding: 7px 16px; border-radius: 3px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer;
}

.m-cancel { border: 1px solid #444; background: transparent; color: #999; }
.m-cancel:hover { color: #e8e8e8; border-color: #666; }

.m-confirm { border: none; background: #e05555; color: #fff; }
.m-confirm:hover { background: #c04444; }

/* ===== TOASTS ===== */
.toast-zone {
  position: fixed; top: 16px; right: 16px; z-index: 300;
  display: flex; flex-direction: column; gap: 6px;
}

.toast {
  padding: 8px 14px; border-radius: 3px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid #333;
  background: #2a2a2a;
}

.toast.ok { color: #4ec9b0; border-color: #2a3a3a; }
.toast.err { color: #e05555; border-color: #3a2a2a; }

.empty-state { padding: 40px 20px; text-align: center; }
.empty-state p { font-size: 13px; color: #555; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="brand">ProcX</div>
    <div class="header-meta">
      <div class="live-badge"><div class="live-dot"></div>live <span class="clock" id="clock"></span></div>
    </div>
  </div>

  <!-- RECOMMENDATIONS -->
  <div class="recs" id="recs"></div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Processes</div>
      <div class="stat-value" id="sProcs">-</div>
      <div class="stat-sub" id="sProcsD">loading...</div>
    </div>
    <div class="stat">
      <div class="stat-label">System CPU</div>
      <div class="stat-value" id="sCpu">-</div>
      <div class="stat-sub" id="sCpuD"></div>
    </div>
    <div class="stat">
      <div class="stat-label">System Memory</div>
      <div class="stat-value" id="sMem">-</div>
      <div class="stat-sub" id="sMemD"></div>
    </div>
    <div class="stat">
      <div class="stat-label">Open Ports</div>
      <div class="stat-value" id="sPorts">-</div>
      <div class="stat-sub" id="sPortsD"></div>
    </div>
  </div>

  <!-- MEMORY MAP -->
  <div class="memmap-section">
    <div class="section-title">Memory Treemap</div>
    <div class="memmap" id="memmap"></div>
    <div class="memmap-tooltip" id="mmTooltip"></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="tab-bar" id="tabs">
      <button class="tab active" data-f="apps">Apps <span class="tab-count" id="cApps">0</span></button>
      <button class="tab" data-f="ports">Ports <span class="tab-count" id="cPorts">0</span></button>
      <button class="tab" data-f="idle">Idle <span class="tab-count" id="cIdle">0</span></button>
      <button class="tab" data-f="hogs">Hogs <span class="tab-count" id="cHogs">0</span></button>
      <button class="tab" data-f="all">All <span class="tab-count" id="cAll">0</span></button>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search by name, pid, port...">
    </div>
    <div class="toolbar-right">
      <button class="icon-btn" onclick="loadData()" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <label class="toggle-label"><input type="checkbox" class="switch" id="autoRef" checked> Auto</label>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="cell-check"><input type="checkbox" class="custom-check" id="selAll"></th>
          <th data-s="pid">PID <span class="sort-arr"></span></th>
          <th data-s="name">Process <span class="sort-arr"></span></th>
          <th data-s="cpu" class="sorted">CPU <span class="sort-arr">&#9662;</span></th>
          <th data-s="rss_mb">Memory <span class="sort-arr"></span></th>
          <th data-s="elapsed">Uptime <span class="sort-arr"></span></th>
          <th>Ports</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- ACTION BAR -->
<div class="action-bar" id="actBar">
  <div class="ab-info"><strong id="selCount">0</strong> selected</div>
  <button class="ab-btn ab-clear" onclick="clearSel()">Clear</button>
  <button class="ab-btn ab-kill" onclick="killSel()">Terminate All</button>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <h2 id="mTitle">Terminate Process</h2>
    <p id="mDesc">This will send SIGTERM. The process may take a moment to exit.</p>
    <div class="modal-preview" id="mPreview"></div>
    <div class="modal-footer">
      <button class="m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-confirm" id="mConfirm">Terminate</button>
    </div>
  </div>
</div>

<div class="toast-zone" id="toasts"></div>

<script>
// ===== STATE =====
let data = { processes: [], groups: [], stats: {}, recommendations: [] };
let filter = "apps";
let sort = { key: "cpu", desc: true };
let sel = new Set();
let expanded = new Set();
let refreshTimer = null;
let cpuHist = [], memHist = [];
const HLEN = 40;

// ===== THEMES =====
const themes = {
  'Cursor': { i:'Cu', bg:'#5b5bd6' },
  'VS Code': { i:'VS', bg:'#0078d4' },
  'Claude Code': { i:'Cl', bg:'#b45309' },
  'IntelliJ IDEA':{ i:'IJ', bg:'#d4510a' },
  'Comet': { i:'Co', bg:'#7c3aed' },
  'ChatGPT': { i:'AI', bg:'#0d9668' },
  'iTerm2': { i:'iT', bg:'#16803c' },
  'node': { i:'No', bg:'#1a8a3e' },
  'python': { i:'Py', bg:'#2563b0' },
  'postgres': { i:'PG', bg:'#336791' },
  'redis': { i:'Re', bg:'#b91c1c' },
  'Docker': { i:'Dk', bg:'#1a7bc4' },
  'Safari': { i:'Sa', bg:'#0a7ec2' },
  'Chrome': { i:'Gc', bg:'#c53929' },
  'esbuild': { i:'ES', bg:'#b07706' },
  'vite': { i:'Vi', bg:'#7c3aed' },
  'Slack': { i:'Sl', bg:'#611f69' },
  'CopyClip': { i:'CC', bg:'#0a7ec2' },
  'WindowServer': { i:'WS', bg:'#555' },
  'Finder': { i:'Fi', bg:'#2563b0' },
};

function theme(name) {
  for (const [k,v] of Object.entries(themes)) { if (name.includes(k)) return v; }
  let h = 0; for (let i=0;i<name.length;i++) h = name.charCodeAt(i)+((h<<5)-h);
  h = Math.abs(h) % 360;
  return { i: name.substring(0,2).toUpperCase(), bg: `hsl(${h},35%,30%)` };
}

// ===== COLORS =====
const COLORS = [
  '#4ec9b0','#569cd6','#c586c0','#ce9178','#d7ba7d','#6a9955',
  '#9cdcfe','#b5cea8','#d4d4d4','#808080','#dcdcaa','#f44747',
  '#4fc1ff','#c8c8c8','#808080','#d16969','#6796e6',
];

function cpuColor(v) { return v>=50?'#e05555':v>=15?'#e5a822':v>=1?'#4ec9b0':'#666'; }
function cpuCls(v) { return v>=50?'c-crit':v>=15?'c-high':v>=1?'c-med':'c-low'; }
function memColor(mb) { return mb>=500?'#e05555':mb>=200?'#e5a822':mb>=50?'#4ec9b0':'#6a9955'; }
function isHog(p) { return p.cpu >= 50 || p.rss_mb >= 500; }

function elapsed2s(s) {
  let d=0, r=s;
  if (s.includes("-")) { const p=s.split("-"); d=parseInt(p[0])||0; r=p[1]; }
  const p=r.split(":").map(Number);
  let sec=d*86400;
  if(p.length===3) sec+=p[0]*3600+p[1]*60+p[2];
  else if(p.length===2) sec+=p[0]*60+p[1];
  else sec+=p[0];
  return sec;
}

function fmtUptime(s) {
  if(s.includes("-")){const[d,t]=s.split("-");return d+"d "+t.split(":")[0]+"h";}
  return s;
}

function fmtMem(mb) { return mb>=1024?(mb/1024).toFixed(1)+" GB":Math.round(mb)+" MB"; }

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

// ===== INIT =====
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active"); filter = t.dataset.f; render();
}));

document.getElementById("search").addEventListener("input", render);

document.querySelectorAll("thead th[data-s]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.s;
  if (sort.key === k) sort.desc = !sort.desc; else sort = { key: k, desc: true };
  document.querySelectorAll("thead th").forEach(t => {
    t.classList.remove("sorted");
    const a = t.querySelector(".sort-arr"); if(a){a.textContent="";a.classList.remove("up");}
  });
  th.classList.add("sorted");
  const a = th.querySelector(".sort-arr");
  if(a){a.textContent="\u25BE";a.classList.toggle("up",!sort.desc);}
  render();
}));

document.getElementById("selAll").addEventListener("change", e => {
  const vis = getVisible();
  if(e.target.checked) vis.forEach(r => { if(r.pids) r.pids.forEach(p=>sel.add(p)); else sel.add(r.pid); });
  else sel.clear();
  render(); updateBar();
});

document.getElementById("autoRef").addEventListener("change", e => { if(e.target.checked) startAuto(); else stopAuto(); });

document.addEventListener("keydown", e => {
  if(e.key==="Escape") closeModal();
  if(e.key==="/" && document.activeElement.tagName!=="INPUT") { e.preventDefault(); document.getElementById("search").focus(); }
});

function startAuto() { stopAuto(); refreshTimer=setInterval(loadData,5000); }
function stopAuto() { if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;} }

// ===== BUILD VISIBLE ROWS =====
function getVisible() {
  const q = document.getElementById("search").value.toLowerCase();
  let procs = data.processes;

  const grouped = new Set();
  const rows = [];

  data.groups.forEach(g => {
    g.pids.forEach(p => grouped.add(p));
    rows.push({ ...g, type: "group", pid: g.pids[0], category: "app" });
  });

  procs.forEach(p => {
    if (!grouped.has(p.pid)) rows.push({ ...p, type: "process" });
  });

  let filtered = rows;

  if (filter === "apps") filtered = filtered.filter(r => r.category === "app");
  else if (filter === "ports") filtered = filtered.filter(r => (r.ports||[]).length > 0);
  else if (filter === "idle") filtered = filtered.filter(r => r.idle);
  else if (filter === "hogs") filtered = filtered.filter(r => isHog(r));

  if (q) {
    filtered = filtered.filter(r =>
      (r.name||"").toLowerCase().includes(q) ||
      (r.command||"").toLowerCase().includes(q) ||
      String(r.pid).includes(q) ||
      (r.ports||[]).some(p => p.includes(q))
    );
  }

  filtered.sort((a,b) => {
    let va=a[sort.key], vb=b[sort.key];
    if(sort.key==="elapsed"){va=elapsed2s(va||"0");vb=elapsed2s(vb||"0");}
    else if(typeof va==="string"){va=(va||"").toLowerCase();vb=(vb||"").toLowerCase();}
    if(va<vb) return sort.desc?1:-1;
    if(va>vb) return sort.desc?-1:1;
    return 0;
  });

  return filtered;
}

// ===== RENDER =====
function render() {
  const rows = getVisible();
  const tbody = document.getElementById("tbody");
  const allApps = data.processes.filter(p => p.category === "app");
  const grouped = new Set(); data.groups.forEach(g => g.pids.forEach(p => grouped.add(p)));

  // Counts
  const groupRows = data.groups.length;
  const ungroupedApps = allApps.filter(p => !grouped.has(p.pid));
  document.getElementById("cApps").textContent = groupRows + ungroupedApps.length;
  document.getElementById("cPorts").textContent = data.processes.filter(p=>p.ports.length>0).length + data.groups.filter(g=>g.ports.length>0).length;
  document.getElementById("cIdle").textContent = data.processes.filter(p=>p.idle&&!grouped.has(p.pid)).length + data.groups.filter(g=>g.idle).length;
  document.getElementById("cHogs").textContent = data.processes.filter(p=>isHog(p)&&!grouped.has(p.pid)).length + data.groups.filter(g=>isHog(g)).length;
  document.getElementById("cAll").textContent = data.processes.length;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><p>No processes match your filter</p></div></td></tr>';
    return;
  }

  let html = "";

  rows.forEach(r => {
    if (r.type === "group") {
      const t = theme(r.name);
      const isExp = expanded.has(r.name);
      const allSel = r.pids.every(p => sel.has(p));
      let cls = allSel ? "row-selected" : r.idle ? "row-idle" : isHog(r) ? "row-hog" : "";

      let badge = "";
      if (isHog(r)) badge = '<span class="badge badge-hog">HOG</span>';
      else if (r.idle) badge = '<span class="badge badge-idle">IDLE</span>';
      else if (r.cpu >= 1) badge = '<span class="badge badge-active">OK</span>';

      html += `<tr class="row-group ${cls}" onclick="toggleGroup('${esc(r.name)}')">
        <td class="cell-check" onclick="event.stopPropagation()"><input type="checkbox" class="custom-check" ${allSel?"checked":""} onchange="toggleGroupSel('${esc(r.name)}',this.checked)"></td>
        <td class="cell-pid">${r.count}x</td>
        <td><div class="proc-row">
          <div class="proc-avatar" style="background:${t.bg}">${t.i}</div>
          <div class="proc-meta">
            <div class="proc-name"><span class="expand-icon ${isExp?'open':''}">&#9654;</span> ${esc(r.name)} <span class="group-count">${r.count}</span></div>
            <div class="proc-cmd">grouped</div>
          </div>
        </div></td>
        <td class="cpu-cell"><div class="cpu-inline"><span class="cpu-text ${cpuCls(r.cpu)}">${r.cpu.toFixed(1)}%</span><div class="cpu-bar-track"><div class="cpu-bar-fill" style="width:${Math.min(r.cpu,100)}%;background:${cpuColor(r.cpu)}"></div></div></div></td>
        <td><div class="mem-vis"><span class="mem-text" style="color:${memColor(r.rss_mb)}">${fmtMem(r.rss_mb)}</span><div class="mem-bar-track"><div class="mem-bar-fill" style="width:${Math.min(r.rss_mb/20,100)}%;background:${memColor(r.rss_mb)}"></div></div></div></td>
        <td class="cell-uptime">-</td>
        <td>${(r.ports||[]).map(p=>`<span class="port-tag">${p}</span>`).join("")||'<span style="color:#555">-</span>'}</td>
        <td>${badge}</td>
        <td><button class="kill-btn" onclick="event.stopPropagation();confirmKillGroup('${esc(r.name)}')">kill all</button></td>
      </tr>`;

      if (isExp) {
        const children = data.processes.filter(p => r.pids.includes(p.pid));
        children.sort((a,b) => b.cpu - a.cpu);
        children.forEach(c => {
          const ct = theme(c.name);
          const isSel = sel.has(c.pid);
          html += buildRow(c, ct, isSel, true);
        });
      }
    } else {
      const t = theme(r.name);
      const isSel = sel.has(r.pid);
      html += buildRow(r, t, isSel, false);
    }
  });

  tbody.innerHTML = html;
  renderStats();
  renderMemmap();
}

function buildRow(p, t, isSel, isChild) {
  let cls = isSel ? "row-selected" : p.idle ? "row-idle" : isHog(p) ? "row-hog" : "";
  if (isChild) cls += " row-child";

  let badge = "";
  if (isHog(p)) badge = '<span class="badge badge-hog">HOG</span>';
  else if (p.idle) badge = '<span class="badge badge-idle">IDLE</span>';
  else if (p.cpu >= 1) badge = '<span class="badge badge-active">OK</span>';

  return `<tr class="${cls}">
    <td class="cell-check"><input type="checkbox" class="custom-check" ${isSel?"checked":""} onchange="toggleSel(${p.pid})"></td>
    <td class="cell-pid">${p.pid}</td>
    <td><div class="proc-row">
      <div class="proc-avatar" style="background:${t.bg}">${t.i}</div>
      <div class="proc-meta">
        <div class="proc-name">${esc(p.name)}</div>
        <div class="proc-cmd" title="${esc(p.command)}">${esc(p.command)}</div>
      </div>
    </div></td>
    <td class="cpu-cell"><div class="cpu-inline"><span class="cpu-text ${cpuCls(p.cpu)}">${p.cpu.toFixed(1)}%</span><div class="cpu-bar-track"><div class="cpu-bar-fill" style="width:${Math.min(p.cpu,100)}%;background:${cpuColor(p.cpu)}"></div></div></div></td>
    <td><div class="mem-vis"><span class="mem-text" style="color:${memColor(p.rss_mb)}">${fmtMem(p.rss_mb)}</span><div class="mem-bar-track"><div class="mem-bar-fill" style="width:${Math.min(p.rss_mb/20,100)}%;background:${memColor(p.rss_mb)}"></div></div></div></td>
    <td class="cell-uptime">${fmtUptime(p.elapsed)}</td>
    <td>${p.ports.map(pt=>`<span class="port-tag">${pt}</span>`).join("")||'<span style="color:#555">-</span>'}</td>
    <td>${badge}</td>
    <td><button class="kill-btn" onclick="confirmKill(${p.pid},'${esc(p.name)}','${esc(p.command)}')">kill</button></td>
  </tr>`;
}

// ===== STATS =====
function renderStats() {
  const s = data.stats;
  const apps = data.processes.filter(p => p.category === "app");
  const ports = new Set(data.processes.flatMap(p => p.ports));

  document.getElementById("sProcs").textContent = apps.length;
  document.getElementById("sProcsD").textContent = `${data.groups.length} app groups`;

  document.getElementById("sCpu").textContent = s.cpu_total ? s.cpu_total + "%" : "-";
  document.getElementById("sCpuD").textContent = s.cpu_user ? `usr ${s.cpu_user}% / sys ${s.cpu_sys}%` : "";

  const memPct = s.mem_pct || 0;
  document.getElementById("sMem").textContent = s.used_mem_gb ? s.used_mem_gb + " GB" : "-";
  document.getElementById("sMemD").textContent = s.total_mem_gb ? `of ${s.total_mem_gb} GB (${memPct}%)` : "";

  document.getElementById("sPorts").textContent = ports.size;
  document.getElementById("sPortsD").textContent = ports.size ? [...ports].slice(0,4).join(", ") + (ports.size>4?"...":"") : "none";

  if (s.cpu_total !== undefined) { cpuHist.push(s.cpu_total); if(cpuHist.length>HLEN) cpuHist.shift(); }
  if (s.used_mem_gb !== undefined) { memHist.push(s.used_mem_gb); if(memHist.length>HLEN) memHist.shift(); }

  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}

// ===== MEMORY MAP =====
function renderMemmap() {
  const mm = document.getElementById("memmap");
  const tt = document.getElementById("mmTooltip");

  const grouped = new Set(); data.groups.forEach(g => g.pids.forEach(p => grouped.add(p)));
  let items = [];
  data.groups.forEach(g => items.push({ name: g.name, rss_mb: g.rss_mb, cpu: g.cpu, type: "group", pids: g.pids }));
  data.processes.filter(p => p.category==="app" && !grouped.has(p.pid) && p.rss_mb > 10).forEach(p =>
    items.push({ name: p.name, rss_mb: p.rss_mb, cpu: p.cpu, type: "proc", pid: p.pid })
  );
  items.sort((a,b) => b.rss_mb - a.rss_mb);

  const total = items.reduce((s,i) => s+i.rss_mb, 0) || 1;

  mm.innerHTML = items.map((item, idx) => {
    const pct = (item.rss_mb / total) * 100;
    const color = COLORS[idx % COLORS.length];
    const showLabel = pct > 6;
    return `<div class="memmap-block" style="flex:${pct};background:${color};"
      onmouseenter="showTT(event,'${esc(item.name)}','${fmtMem(item.rss_mb)} | CPU ${item.cpu.toFixed(1)}%')"
      onmousemove="moveTT(event)" onmouseleave="hideTT()">
      ${showLabel ? `<span class="mm-label">${esc(item.name)}</span>` : ''}
    </div>`;
  }).join("");
}

function showTT(e, name, detail) {
  const tt = document.getElementById("mmTooltip");
  tt.innerHTML = `<div class="tt-name">${name}</div><div class="tt-detail">${detail}</div>`;
  tt.style.display = "block";
  moveTT(e);
}

function moveTT(e) {
  const tt = document.getElementById("mmTooltip");
  tt.style.left = (e.clientX + 12) + "px";
  tt.style.top = (e.clientY - 40) + "px";
}

function hideTT() { document.getElementById("mmTooltip").style.display = "none"; }

// ===== RECOMMENDATIONS =====
function renderRecs() {
  const el = document.getElementById("recs");
  if (!data.recommendations.length) { el.innerHTML = ""; return; }

  el.innerHTML = data.recommendations.map(r => {
    let cls = "", label = "", btnText = "";
    if (r.type === "free_memory") { cls = "memory"; label = "MEM"; btnText = "Free Now"; }
    else if (r.type === "cpu_hog") { cls = "cpu"; label = "CPU"; btnText = "Review"; }
    else if (r.type === "stale") { cls = "stale"; label = "STALE"; btnText = "Clean Up"; }

    const pids = r.items.flatMap(i => i.pids || []);

    return `<div class="rec-banner ${cls}">
      <span class="rec-label">${label}</span>
      <span class="rec-msg">${esc(r.title)} &mdash; ${esc(r.desc)}</span>
      <button class="rec-btn" onclick="confirmKillPids([${pids.join(",")}],'${esc(r.title)}','${esc(r.desc)}')">${btnText}</button>
    </div>`;
  }).join("");
}

// ===== SELECTION =====
function toggleSel(pid) { if(sel.has(pid)) sel.delete(pid); else sel.add(pid); render(); updateBar(); }

function toggleGroup(name) {
  if(expanded.has(name)) expanded.delete(name); else expanded.add(name);
  render();
}

function toggleGroupSel(name, checked) {
  const g = data.groups.find(x => x.name === name);
  if(!g) return;
  if(checked) g.pids.forEach(p => sel.add(p));
  else g.pids.forEach(p => sel.delete(p));
  render(); updateBar();
}

function clearSel() { sel.clear(); document.getElementById("selAll").checked=false; render(); updateBar(); }

function updateBar() {
  document.getElementById("selCount").textContent = sel.size;
  document.getElementById("actBar").classList.toggle("show", sel.size > 0);
}

// ===== KILL =====
function confirmKill(pid, name, cmd) {
  document.getElementById("mTitle").textContent = "Terminate Process";
  document.getElementById("mDesc").textContent = "This will send SIGTERM. The process may take a moment to exit.";
  document.getElementById("mPreview").innerHTML = `<div class="mp-name">${esc(name)}</div>PID: ${pid}<br>${esc(cmd)}`;
  document.getElementById("mConfirm").onclick = () => doKill([pid]);
  document.getElementById("modalBg").classList.add("open");
}

function confirmKillGroup(name) {
  const g = data.groups.find(x => x.name === name);
  if(!g) return;
  document.getElementById("mTitle").textContent = `Terminate ${g.name}`;
  document.getElementById("mDesc").textContent = `Kill all ${g.count} ${g.name} processes (${fmtMem(g.rss_mb)}).`;
  document.getElementById("mPreview").innerHTML = g.pids.map(p=>`PID: ${p}`).join("<br>");
  document.getElementById("mConfirm").onclick = () => doKill(g.pids);
  document.getElementById("modalBg").classList.add("open");
}

function confirmKillPids(pids, title, desc) {
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mDesc").textContent = desc + ". Terminate these processes?";
  document.getElementById("mPreview").innerHTML = pids.map(p => {
    const proc = data.processes.find(x=>x.pid===p);
    return proc ? `${proc.name} (PID: ${p})` : `PID: ${p}`;
  }).join("<br>");
  document.getElementById("mConfirm").onclick = () => doKill(pids);
  document.getElementById("modalBg").classList.add("open");
}

function killSel() {
  if(!sel.size) return;
  const pids = [...sel];
  document.getElementById("mTitle").textContent = `Terminate ${pids.length} Processes`;
  document.getElementById("mDesc").textContent = "This will send SIGTERM to all selected processes.";
  document.getElementById("mPreview").innerHTML = pids.map(p => {
    const proc = data.processes.find(x=>x.pid===p);
    return proc ? `${proc.name} (PID: ${p})` : `PID: ${p}`;
  }).join("<br>");
  document.getElementById("mConfirm").onclick = () => { doKill(pids); sel.clear(); updateBar(); };
  document.getElementById("modalBg").classList.add("open");
}

function closeModal() { document.getElementById("modalBg").classList.remove("open"); }

async function doKill(pids) {
  closeModal();
  try {
    const res = await fetch("/api/kill", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ pids, signal: "TERM" })
    });
    const d = await res.json();
    const ok = d.results.filter(r => r.ok).length;
    const fail = d.results.filter(r => r.error).length;
    if (ok) toast(`Terminated ${ok} process${ok>1?"es":""}`, "ok");
    if (fail) toast(`${fail} failed (permission denied)`, "err");
    pids.forEach(p => sel.delete(p)); updateBar();
    setTimeout(loadData, 600);
  } catch(e) { toast("Error: "+e.message, "err"); }
}

function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = `<span>${msg}</span>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity 0.3s";},2500);
  setTimeout(()=>el.remove(),3000);
}

// ===== DATA LOADING =====
async function loadData() {
  try {
    const res = await fetch("/api/data");
    data = await res.json();
    renderRecs();
    render();
    updateBar();
  } catch(e) { console.error(e); }
}

loadData();
startAuto();
</script>
</body>
